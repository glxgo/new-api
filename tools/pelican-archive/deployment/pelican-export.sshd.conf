# Include from sshd_config only after checking effective Match/Include ordering.
Match User pelican-export
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    DisableForwarding yes
    X11Forwarding no
    PermitUserRC no
    AuthorizedKeysFile /etc/ssh/authorized_keys/pelican-export
    ForceCommand /usr/local/lib/pelican-archive/source-login.sh
Match all
